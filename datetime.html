<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const now = new Date();

        // Get the current time in a user-friendly format (e.g., "10:30 AM")
        const time = now.toLocaleTimeString('en-US', {
            hour: '2-digit',
            minute: '2-digit'
        });

        // Get the current date in a user-friendly format (e.g., "Sunday, August 17, 2025")
        const date = now.toLocaleDateString('en-US', {
            weekday: 'long',
            year: 'numeric',
            month: 'long',
            day: 'numeric'
        });

        // You can create a combined date and time string as well
        const dateTime = now.toLocaleString('en-US');

        // Voiceflow variables to store the output
        var currentTime = time;
        var currentDate = date;
        var currentDateTime = dateTime;
        console.log('Time ',currentTime)
        console.log('date ',currentDate)
        console.log('Time and date',currentDateTime)
    </script>
</body>
</html>
